name: 🧠 Update GitHub Activity in README

on:
  schedule:
    - cron: '0 6 * * *' # every day at 6 AM UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install GitHub Activity
        run: |
          npm install -g @devjometo/latest-commits

      - name: Update README with latest commits
        env:
          GH_TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          latest-commits --username estiller28 --limit 5 --token $GH_TOKEN >> README.md

      - name: Commit and Push
        run: |
          git config --global user.name "estiller28"
          git config --global user.email "estillerdaniel@gmail.com"
          git add README.md
          git commit -m "📈 update: latest commits added to README [auto]" || echo "No changes to commit"
          git push
